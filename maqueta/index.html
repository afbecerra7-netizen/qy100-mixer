<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QY100 Mixer — maqueta</title>
<!--
  Maqueta del QY100 Mixer: una sola pantalla, sin scroll, con la carcasa del emulador QYΩ.
  Nada de esto manda MIDI: los valores son de muestra y los botones solo cambian la vista.
  La gráfica es la del emulador de Doffu (qy-look.css, GPL-3.0). El logo y el nombre DOFFU
  no son GPL y no se usan: la marca de esta app es provisional.
-->
<link rel="stylesheet" href="qy-look.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  main { max-width: none; height: 100%; padding: 8px; box-sizing: border-box; display: grid; place-items: center; }
  #face { width: min(100%, calc((100vh - 16px) * 1700 / 1000)); }

  /* --- the screen: a mixer overview, like the QY100's own MIXER page --- */
  #lcdwrap { width: 100%; height: 100%; }
  #mixlcd { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 1.6cqw 2cqw 1.2cqw;
    color: #1f2a14; font: 700 1.55cqw/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
  #mixlcd .top { display: flex; align-items: center; gap: 1.2cqw; }
  #mixlcd .pill { background: #1f2a14; color: var(--tint, #bad18f); border-radius: 1cqw; padding: 0.25cqw 1cqw; }
  #mixlcd .grow { flex: 1; }
  #mixlcd .bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1.2cqw; align-items: end; padding: 1.4cqw 0 0.6cqw; }
  #mixlcd .col { display: grid; grid-template-rows: 1fr auto auto; height: 100%; justify-items: center; gap: 0.4cqw; }
  #mixlcd .meter { width: 52%; height: 100%; border: 0.18cqw solid #1f2a14; position: relative; }
  #mixlcd .meter i { position: absolute; left: 0; right: 0; bottom: 0; background: #1f2a14; }
  #mixlcd .col.m .meter i { background: repeating-linear-gradient(45deg, #1f2a14 0 0.3cqw, transparent 0.3cqw 0.7cqw); }
  #mixlcd .num { font-size: 1.35cqw; }
  #mixlcd .mflag { font-size: 1.2cqw; min-height: 1.2cqw; }
  #mixlcd .col.sel .num { background: #1f2a14; color: var(--tint, #bad18f); padding: 0 0.4cqw; }
  #mixlcd .msg { display: flex; justify-content: space-between; font-size: 1.25cqw; border-top: 0.18cqw solid #1f2a14; padding-top: 0.6cqw; }

  /* --- the strips, in the keyboard well --- */
  .strip-num { font-size: max(8px, 2.1cqw); }
  .strip-name { font-style: normal; font-weight: 600; opacity: 0.85; }
  .mk { cursor: ns-resize; touch-action: none; }
  .mk::after { content: ""; position: absolute; left: 50%; top: 9%; width: 0.22cqw; height: 34%; background: currentColor;
    border-radius: 0.2cqw; transform-origin: 50% 120%; transform: translateX(-50%) rotate(var(--a, 0deg)); color: #e8e9eb; }
  .mk.c::before { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: rgba(0,0,0,.25); }
  .vfader { position: absolute; margin: 0; width: 2.4cqw; height: auto; padding: 0; }
  .vfader::-webkit-slider-runnable-track { width: 0.55cqw; }
  .vfader::-webkit-slider-thumb { width: 2.2cqw; height: 1.25cqw; margin-left: -0.82cqw; }
  .fk.mute.on { background: linear-gradient(#e0574b, #b8332a); color: #fff; }
  .fk.page.on { box-shadow: 0 0 0 0.25cqw var(--accent) inset; }
  .fk .sub { display: block; font-size: 0.72em; font-weight: 600; opacity: 0.8; font-style: normal; margin-top: 0.2em; }
</style>
</head>
<body>
<main>
  <div id="face">
    <div id="bezel"></div>
    <div id="lcdwin"><div id="lcdwrap" class="tint grid"><div id="mixlcd"></div></div></div>
    <div id="piano"></div>
  </div>
</main>
<script>
  // ---- placing, as in the emulator: centres and sizes in faceplate units (1700 x 1000) ----
  const FW = 1700, FH = 1000;
  const face = document.getElementById('face');
  const place = (el, cx, cy, w, h) => {
    Object.assign(el.style, { left: cx / FW * 100 + '%', top: cy / FH * 100 + '%', width: w / FW * 100 + '%',
      height: h / FH * 100 + '%', transform: 'translate(-50%, -50%)' });
    face.appendChild(el);
    return el;
  };
  const deco = (cls, cx, cy, w, h) => place(Object.assign(document.createElement('div'), { className: cls }), cx, cy, w, h);
  const text = (t, cx, cy, size, cls = '') => {
    const s = document.createElement('span');
    s.className = 'fl ' + cls; s.innerHTML = t;
    s.style.left = cx / FW * 100 + '%'; s.style.top = cy / FH * 100 + '%';
    if (size) s.style.fontSize = 'max(5px, ' + size / FW * 100 + 'cqw)';
    face.appendChild(s);
    return s;
  };
  const key = (label, cx, cy, w, h, cls, onClick) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'fk ' + (cls || ''); b.innerHTML = label;
    if (onClick) b.addEventListener('click', onClick);
    return place(b, cx, cy, w, h);
  };

  // ---- sample data (nothing here talks to a device) ----
  const PAGES = [
    { id: 'song1', label: 'SONG<span class="sub">1–8</span>', parts: [0, 1, 2, 3, 4, 5, 6, 7], lcd: 'SONG 1-8' },
    { id: 'song2', label: 'SONG<span class="sub">9–16</span>', parts: [8, 9, 10, 11, 12, 13, 14, 15], lcd: 'SONG 9-16' },
    { id: 'patt', label: 'PATT<span class="sub">D1–C4</span>', parts: [16, 17, 18, 19, 20, 21, 22, 23], lcd: 'PATTERN' },
  ];
  const PATT = ['D1', 'D2', 'PC', 'BA', 'C1', 'C2', 'C3', 'C4'];
  const NAMES = { 0: 'DRUMBRUTE', 2: 'RIDDIM', 3: 'MINITAUR', 4: 'VOLCA KEYS', 5: 'LEMONDROP',
    16: 'DRUMBRUTE', 18: 'RIDDIM', 19: 'MINITAUR', 20: 'VOLCA KEYS', 21: 'LEMONDROP' };
  const state = Array.from({ length: 24 }, (_, p) => ({
    vol: [100, 92, 110, 96, 88, 104, 80, 74][p % 8], pan: [64, 50, 64, 64, 78, 40, 64, 90][p % 8],
    rev: [20, 40, 10, 30, 64, 70, 40, 52][p % 8], cho: [0, 0, 20, 0, 40, 30, 0, 10][p % 8],
    vari: 0, mute: [0, 2, 3, 4, 5].includes(p),
  }));
  const SKINS = ['dark', 'aero', 'kawaii', 'terminal', 'vintage', 'synthwave'];
  let page = 0, skin = 0, sel = 0, lastMsg = 'MAQUETA: NO MANDA MIDI';

  // ---- the moulded body, as in the emulator ----
  deco('cap l', 22, 500, 44, 1000);
  deco('cap r', 1678, 500, 44, 1000);
  deco('lip', 850, 975, 1700, 50);
  deco('groove', 850, 572, 1612, 3);
  deco('well', 951, 776, 1344, 360);
  place(document.getElementById('bezel'), 850, 272, 850, 500);
  place(document.getElementById('lcdwin'), 850, 262, 800, 400);
  text('<b>QY</b> MIXER', 850, 42, 34);
  text('<span class="xg">QY100</span>', 1170, 497, 30);
  text('maqueta', 520, 497, 22);

  // ---- left column: the three pages (like SONG / PATTERN), and two lights ----
  const ledOut = deco('fled green on', 120, 105, 30, 30);
  text('MIDI', 180, 105, 22);
  const ledSend = deco('fled', 120, 165, 30, 30);
  text('SEND', 182, 165, 22);
  const pageKeys = PAGES.map((p, i) => key(p.label, 150, 270 + i * 95, 160, 78, 'page', () => { page = i; sel = 0; render(); }));

  // ---- right: F keys with their job written on them, and a big SEND ALL in the ring ----
  key('PULL<span class="sub">read QY</span>', 1325, 130, 110, 66, 'sm', () => flash('PULL: NEEDS MIDI IN'));
  key('MIDI<span class="sub">port</span>', 1325, 232, 110, 66, 'sm', () => flash('OUT: L6MAX MIDI I/O'));
  key('LOOK<span class="sub">skin</span>', 1325, 334, 110, 66, 'sm', () => { skin = (skin + 1) % SKINS.length;
    document.documentElement.dataset.skin = SKINS[skin]; if (!skin) delete document.documentElement.dataset.skin; flash('LOOK: ' + SKINS[skin]); });
  key('NAMES<span class="sub">edit</span>', 1325, 436, 110, 66, 'sm', () => flash('NAMES: EDIT ON THE STRIP'));
  deco('ring', 1530, 300, 260, 260);
  key('SEND<br>ALL', 1530, 300, 170, 170, 'round', () => {
    ledSend.classList.add('on'); setTimeout(() => ledSend.classList.remove('on'), 400); flash('SENT 168 VALUES'); });
  text('every strip, every page', 1530, 455, 20);

  // ---- the strips, in the well ----
  const X0 = 370, PITCH = 166;
  const stripEls = [];
  function knob(cx, cy, d, get, set, label) {
    const k = deco('ring mk c', cx, cy, d, d);
    text(label, cx, cy + d / 2 + 14, 15);
    let y0 = 0, v0 = 0;
    const paint = () => k.style.setProperty('--a', (get() / 127 * 270 - 135) + 'deg');
    k.addEventListener('pointerdown', (e) => { y0 = e.clientY; v0 = get(); k.setPointerCapture(e.pointerId); });
    k.addEventListener('pointermove', (e) => { if (!k.hasPointerCapture(e.pointerId)) return;
      set(Math.max(0, Math.min(127, Math.round(v0 + (y0 - e.clientY) * 0.8)))); paint(); drawLcd(); });
    paint();
    return paint;
  }
  for (let i = 0; i < 8; i++) {
    const cx = X0 + i * PITCH;
    const s = { num: text('', cx, 608, 0, 'strip-num'), name: text('', cx, 636, 15, 'strip-name') };
    const P = () => PAGES[page].parts[i];
    s.knobs = [
      knob(cx - 36, 690, 50, () => state[P()].pan, (v) => { state[P()].pan = v; }, 'PAN'),
      knob(cx + 36, 690, 50, () => state[P()].rev, (v) => { state[P()].rev = v; }, 'REV'),
      knob(cx - 36, 764, 50, () => state[P()].cho, (v) => { state[P()].cho = v; }, 'CHO'),
      knob(cx + 36, 764, 50, () => state[P()].vari, (v) => { state[P()].vari = v; }, 'VAR'),
    ];
    const f = document.createElement('input');
    f.type = 'range'; f.min = 0; f.max = 127; f.className = 'vfader';
    f.addEventListener('input', () => { state[P()].vol = Number(f.value); sel = i; s.val.textContent = f.value; drawLcd(); });
    place(f, cx - 38, 878, 40, 118);
    s.fader = f;
    s.val = text('', cx - 38, 946, 16);
    s.mute = key('MUTE', cx + 34, 912, 70, 46, 'sm mute', () => { const st = state[P()]; st.mute = !st.mute; sel = i; render(); });
    s.led = deco('fled', cx + 34, 866, 18, 18);
    stripEls.push(s);
  }

  // ---- drawing ----
  function drawLcd() {
    const pg = PAGES[page];
    const cols = pg.parts.map((p, i) => {
      const st = state[p];
      const label = p < 16 ? String(p + 1).padStart(2, '0') : PATT[p - 16];
      return `<div class="col${st.mute ? ' m' : ''}${i === sel ? ' sel' : ''}"><div class="meter"><i style="height:${st.vol / 127 * 100}%"></i></div>`
        + `<span class="num">${label}</span><span class="mflag">${st.mute ? 'M' : ''}</span></div>`;
    }).join('');
    const p = pg.parts[sel], st = state[p];
    const who = (NAMES[p] || 'QY100');
    document.getElementById('mixlcd').innerHTML =
      `<div class="top"><span class="pill">MIX</span><span>${pg.lcd}</span><span class="grow"></span><span>OUT L6MAX</span></div>`
      + `<div class="bars">${cols}</div>`
      + `<div class="msg"><span>${p < 16 ? 'PART ' + (p + 1) : PATT[p - 16]} ${who} VOL${String(st.vol).padStart(3, ' ')}</span><span>${lastMsg}</span></div>`;
  }
  function flash(msg) { lastMsg = msg; drawLcd(); }
  function render() {
    pageKeys.forEach((k, i) => k.classList.toggle('on', i === page));
    PAGES[page].parts.forEach((p, i) => {
      const s = stripEls[i], st = state[p];
      s.num.textContent = p < 16 ? String(p + 1) : PATT[p - 16];
      s.name.textContent = NAMES[p] || 'QY100';
      s.fader.value = st.vol; s.val.textContent = st.vol;
      s.knobs.forEach((paint) => paint());
      s.mute.classList.toggle('on', st.mute); s.led.classList.toggle('on', st.mute);
      s.mute.title = p < 16 ? 'Rcv Channel Off: the QY stops doubling the synth on this channel' : 'Volume 0 on this pattern track';
    });
    drawLcd();
  }
  render();
</script>
</body>
</html>
